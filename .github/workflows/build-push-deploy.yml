name: Build and push Docker images and Deploy to EKS

on:
  push:
    branches:
      - aws-eks-terraform-cicd

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY_FRONTEND: graphapp-eks-frontend
  ECR_REPOSITORY_BACKEND: graphapp-eks-backend
  EKS_CLUSTER: tfgraphapp-eks-cluster
  K8S_NAMESPACE: graphapp
  DEPLOYMENT_NAME_FRONTEND: deployment-frontend
  DEPLOYMENT_NAME_BACKEND: deployment-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::693938699452:role/GitHubAction-AssumeRoleWithAction-tfGraphApp-ECR
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build and push frontend Docker image
      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            ./frontend

          docker push \
            $REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG

      # 5. Build and push backend Docker image
      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
            ./backend

          docker push \
            $REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG

      # 6. Configure kubectl for EKS
      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      # 7. Restart Kubernetes deployments
      - name: Restart deployments
        run: |
          kubectl rollout restart \
            deployment/$DEPLOYMENT_NAME_FRONTEND \
            -n $K8S_NAMESPACE

          kubectl rollout restart \
            deployment/$DEPLOYMENT_NAME_BACKEND \
            -n $K8S_NAMESPACE

      # 8. Verify frontend rollout
      - name: Verify frontend deployment
        run: |
          kubectl rollout status \
            deployment/$DEPLOYMENT_NAME_FRONTEND \
            -n $K8S_NAMESPACE \
            --timeout=180s

      # 9. Verify backend rollout
      - name: Verify backend deployment
        run: |
          kubectl rollout status \
            deployment/$DEPLOYMENT_NAME_BACKEND \
            -n $K8S_NAMESPACE \
            --timeout=180s
