apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: graphapp-deployment-manager
  namespace: graphapp
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deployment-binding
  namespace: graphapp
subjects:
  - kind: Group
    name: graphapp-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: graphapp-deployment-manager
  apiGroup: rbac.authorization.k8s.io