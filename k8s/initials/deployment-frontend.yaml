apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-frontend
  namespace: graphapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
        - name: frontend-app
          image: 693938699452.dkr.ecr.ap-northeast-1.amazonaws.com/graphapp-eks-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
            limits:
              cpu: "100m"
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
          envFrom:
            - configMapRef:
                name: frontend-config
      volumes:
        - name: config
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: graphapp
spec:
  selector:
    app: frontend-app
  # type: NodePort
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 80
