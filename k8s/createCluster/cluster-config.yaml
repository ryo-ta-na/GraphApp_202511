apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: tfgraphapp-eks-cluster
  region: ap-northeast-1
  version: "1.33"

vpc:
  id: "vpc-037fe7166d5a49605"
  subnets:
    # Cluster subnets (for X-ENI) - /28 each, dedicated for EKS control plane
    private:
      ap-northeast-1a: { id: subnet-09ab4d1cca2e5e233 }  # 192.168.240.0/28
      ap-northeast-1c: { id: subnet-0155b553db6ff5a73 }  # 192.168.240.16/28
  # IMPORTANT: Do NOT specify public subnets here - only cluster subnets!
  clusterEndpoints:
    publicAccess: true   # Enable both endpoints as we discussed
    privateAccess: true  # This keeps node communication inside VPC
  publicAccessCidrs:
    - "81.155.54.12/32"   # Replace with your office IP range (CIDR restriction)

managedNodeGroups:
  - name: private-nodes
    instanceType: t3.small
    minSize: 2
    maxSize: 5
    desiredCapacity: 2
    privateNetworking: true  # Nodes get private IPs only
    # Node subnets - our private app subnets
    subnets:
      - subnet-03b0e52063b78e591  # 192.168.51.0/24 (AZ-a)
      - subnet-038856e3a64b70600  # 192.168.52.0/24 (AZ-c)
    # Security group rules for node communication
    securityGroups:
      attachIDs: ["sg-047e8c9ee57467ed2"]  # Your DB security group if needed
    ssh:
      allow: false  # Disable SSH for security
    tags:
      # Required for node identification
      kubernetes.io/cluster/graphapp-eks-cluster: owned